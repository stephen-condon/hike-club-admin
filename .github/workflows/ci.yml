name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash-and-merge uses the PR title as the commit message semantic-release
      # parses, so an unconventional title means merging silently produces no
      # release instead of failing loudly. Catch it here instead.
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The repo is private, so listing the PR's commits needs an explicit grant.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@166cdddc0349c6f3c1da17f66a8fc88ec3bc4dd5 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      # src/lib.rs and src/r2_store.rs are Workers-runtime glue that can't
      # execute outside a deployed worker; they're covered by `wrangler dev
      # --remote` checks instead.
      - name: Coverage gate (core logic, 85%)
        run: |
          cargo llvm-cov \
            --ignore-filename-regex 'src/(lib|r2_store)\.rs$' \
            --fail-under-lines 85

  # No preview deploy: this worker writes to the one real bucket, so a preview
  # environment would write there too. PRs are verified by the suite above and
  # `wrangler dev --remote` locally.
