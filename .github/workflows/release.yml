name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # semantic-release comments on the issues/PRs a release touches by default,
  # which needs both grants beyond contents: write.
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # No post-deploy smoke test: Cloudflare Access sits in front of every
      # route, so CI would need a service token to reach one. The deploy is
      # verified by opening the page.

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release tooling
        run: npm ci

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
