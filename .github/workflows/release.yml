name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # semantic-release comments on the issues/PRs a release touches by default,
  # which needs both grants beyond contents: write.
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The Cloudflare deploy secrets live on this environment, which only main
    # may deploy from, so no other branch's workflow can read them.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # No post-deploy smoke test: Cloudflare Access sits in front of every
      # route, so CI would need a service token to reach one. The deploy is
      # verified by opening the page.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install release tooling
        run: npm ci

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
