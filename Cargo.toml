[package]
name = "hike-club-admin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "=0.2.125"
worker = "0.8.5"
worker-macros = "0.8.5"

[dev-dependencies]
jsonschema = "0.35"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[profile.release]
opt-level = "z"
lto = true
# ponytail: no `strip = true` — it strips the wasm "target_features" custom
# section wasm-bindgen needs to detect reference-types support, which breaks
# worker-build. Same reason as hike-club-api's Cargo.toml.
codegen-units = 1
