<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hike Club</title>
<style>
/* Forest-preserve signage in a Material key: tonal surfaces instead of drop
   shadows, and the painted trail blaze that marks a route on a tree. Each row
   wears its trail's blaze colour, taken from the trail name itself.
   @spec HIKE-UI-008 */
:root {
  --surface: #fcfdf7;
  --surface-container: #f0f4ec;
  --surface-container-high: #eaefe5;
  --surface-container-highest: #e4e9df;
  --on-surface: #191d17;
  --on-surface-variant: #43483f;
  --outline: #73796e;
  --outline-variant: #c3c8bc;
  --primary: #2f5d3f;
  --on-primary: #ffffff;
  --primary-container: #b4f0c2;
  --on-primary-container: #00210e;
  --tertiary-container: #ffdea6;
  --on-tertiary-container: #291800;
  --error: #8f4b34;
  --error-container: #ffdbd0;
  --on-error-container: #3a0b00;
  --scrim: rgba(10, 20, 12, 0.4);

  /* Blaze colours are decorative, but they still have to be seen, so each
     scheme gets its own set rather than one set washing out on the other. */
  --blaze-purple: #6b4a9e;
  --blaze-green: #2f7d46;
  --blaze-blue: #2a5ea8;
  --blaze-red: #b3332c;
  --blaze-yellow: #c99a1f;
  --blaze-orange: #d2742a;
  --blaze-brown: #7a5a3c;
  --blaze-white: #bfc6bd;
  --blaze-black: #2b332c;
  --blaze-pink: #c9628e;
  --blaze-silver: #9aa5a0;
  --blaze-gray: #8b958f;
  --blaze-grey: #8b958f;
  --blaze-tan: #b89a66;

  --shape-xs: 4px;
  --shape-sm: 8px;
  --shape-md: 12px;
  --shape-lg: 16px;
  --shape-xl: 28px;
  --shape-full: 999px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur: 200ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #10140f;
    --surface-container: #1c211a;
    --surface-container-high: #262b24;
    --surface-container-highest: #31362e;
    --on-surface: #e1e5db;
    --on-surface-variant: #c3c8bc;
    --outline: #8d9387;
    --outline-variant: #43483f;
    --primary: #98d4a7;
    --on-primary: #00391b;
    --primary-container: #14522a;
    --on-primary-container: #b4f0c2;
    --tertiary-container: #5b4200;
    --on-tertiary-container: #ffdea6;
    --error: #ffb5a0;
    --error-container: #723520;
    --on-error-container: #ffdbd0;
    --scrim: rgba(0, 0, 0, 0.6);

    --blaze-purple: #b49ce6;
    --blaze-green: #6ec57f;
    --blaze-blue: #8db4ee;
    --blaze-red: #f08a7c;
    --blaze-yellow: #e8c765;
    --blaze-orange: #eea36a;
    --blaze-brown: #c3a183;
    --blaze-white: #f2f4ef;
    --blaze-black: #6a7169;
    --blaze-pink: #eda0bf;
    --blaze-silver: #c2ccc6;
    --blaze-gray: #b3bcb6;
    --blaze-grey: #b3bcb6;
    --blaze-tan: #dcc7a3;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--on-surface);
  font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1rem 5rem; }
h1, h2, h3 { margin: 0; font-weight: 500; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Material's state layer: a tinted overlay at a fixed opacity, rather than a
   separate hover colour per component. */
.row, .link, .primary, .ghost { position: relative; overflow: hidden; }
.row::before, .link::before, .primary::before, .ghost::before {
  content: "";
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0;
  pointer-events: none;
}
.row:hover::before, .link:hover::before,
.primary:hover::before, .ghost:hover::before { opacity: 0.08; }
.row:focus-visible::before, .link:focus-visible::before,
.primary:focus-visible::before, .ghost:focus-visible::before { opacity: 0.12; }
.row > *, .link > *, .primary > *, .ghost > * { position: relative; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 2.5rem 0 0.75rem; }
.bar h2 { font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; color: var(--on-surface-variant); }
.link {
  background: none;
  border: 0;
  padding: 0.5rem 0.9rem;
  border-radius: var(--shape-full);
  color: var(--primary);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
}

/* The location list is one filled card; rows are Material two-line list items. */
ul { list-style: none; margin: 0; padding: 0; }
#list, #orphan-list {
  background: var(--surface-container);
  border-radius: var(--shape-md);
  overflow: hidden;
}
.row {
  display: grid;
  grid-template-columns: 1.25rem 1fr auto;
  gap: 0 0.75rem;
  align-items: center;
  width: 100%;
  min-height: 4.5rem;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  color: var(--on-surface);
}
li + li .row { box-shadow: inset 0 1px 0 var(--outline-variant); }
.blaze {
  width: 4px;
  margin: 1rem auto;
  align-self: stretch;
  border-radius: var(--shape-full);
  background: var(--outline-variant);
}
/* The list card clips to its radius, which would cut an outset focus ring off
   at the card edge, so a row draws its own ring inside itself. */
.row:focus-visible { outline-offset: -3px; }
.row > div { padding: 0.9rem 0; }
.place { font-size: 1rem; }
.detail { font-size: 0.875rem; color: var(--on-surface-variant); margin-top: 0.15rem; }
.detail.unset {
  display: inline-block;
  margin-top: 0.3rem;
  padding: 0.125rem 0.625rem;
  border-radius: var(--shape-full);
  background: var(--tertiary-container);
  color: var(--on-tertiary-container);
  font-size: 0.8125rem;
}
.chevron { color: var(--on-surface-variant); padding-right: 0.9rem; }

dialog {
  width: min(34rem, calc(100vw - 2rem));
  padding: 0;
  border: 0;
  border-radius: var(--shape-xl);
  background: var(--surface-container-high);
  color: var(--on-surface);
}
dialog::backdrop { background: var(--scrim); }
.sheet { display: flex; flex-direction: column; max-height: min(85vh, 44rem); }
.sheet-head { padding: 1.5rem 1.5rem 0.5rem; }
.sheet-head h2 { font-size: 1.375rem; line-height: 1.3; }
.sheet-body { overflow-y: auto; padding: 1rem 1.5rem 0; }

label { display: block; margin-bottom: 1rem; }
label span {
  display: block;
  margin-bottom: 0.3rem;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: var(--on-surface-variant);
}
/* Material filled text field. The label sits above rather than floating into
   the box: a floating label keys off :placeholder-shown, which a number or
   file input never reports. */
input[type=text], input[type=number] {
  width: 100%;
  padding: 0.7rem 0.75rem;
  border: 0;
  border-radius: var(--shape-xs) var(--shape-xs) 0 0;
  background: var(--surface-container-highest);
  box-shadow: inset 0 -1px 0 var(--outline);
}
input[type=text]:focus, input[type=number]:focus {
  outline: 0;
  box-shadow: inset 0 -2px 0 var(--primary);
}
input[type=file] { width: 100%; font-size: 0.875rem; color: var(--on-surface-variant); }
input[type=file]::file-selector-button {
  margin-right: 0.75rem;
  padding: 0.5rem 1rem;
  border: 1px solid var(--outline);
  border-radius: var(--shape-full);
  background: none;
  color: var(--primary);
  font: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
}
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
.map { width: 100%; margin-bottom: 0.5rem; border: 1px solid var(--outline-variant); border-radius: var(--shape-md); display: block; }

.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 1rem 1.5rem 1.5rem; }
.primary {
  padding: 0.625rem 1.5rem;
  border: 0;
  border-radius: var(--shape-full);
  background: var(--primary);
  color: var(--on-primary);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
}
.primary[disabled] { opacity: 0.4; cursor: default; }
.ghost {
  padding: 0.625rem 1.25rem;
  border: 1px solid var(--outline);
  border-radius: var(--shape-full);
  background: none;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
}
.danger { color: var(--error); border-color: transparent; }
.spacer { flex: 1; }
.note { margin: 0.75rem 0 0; font-size: 0.875rem; color: var(--on-surface-variant); min-height: 1.4em; }
.note.bad { color: var(--error); }
#status { padding: 0 0.25rem; }

.loc-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.75rem; align-items: center; }
.loc-row input { margin: 0; }
.loc-row input[readonly] { background: none; color: var(--on-surface-variant); box-shadow: inset 0 -1px 0 var(--outline-variant); }
.loc-row .ghost { padding: 0.5rem 1rem; }

.orphan { display: flex; justify-content: space-between; gap: 1rem; padding: 0.9rem 1rem; font-size: 0.9rem; }
li + li .orphan { box-shadow: inset 0 1px 0 var(--outline-variant); }
.orphan .slug { font-family: ui-monospace, monospace; }

/* @spec HIKE-UI-006 */
@media (prefers-reduced-motion: no-preference) {
  .saved { animation: flash 900ms var(--ease); }
  .row::before, .link::before, .primary::before, .ghost::before,
  input[type=text], input[type=number] { transition: opacity var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
}
@keyframes flash { from { background: var(--primary-container); } to { background: transparent; } }
@media (max-width: 30rem) { .pair, .loc-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h2 id="all-hikes">All locations</h2>
    <button class="link" id="edit-locations">Edit locations</button>
  </div>
  <ul id="list" aria-labelledby="all-hikes"></ul>
  <p class="note" id="status"></p>

  <section id="orphans" hidden>
    <div class="bar"><h2 id="orphan-head">Left behind</h2></div>
    <ul id="orphan-list" aria-labelledby="orphan-head"></ul>
    <p class="note">These objects have no location in the list. Re-add the location to recover them — nothing here has been deleted.</p>
  </section>
</main>

<dialog id="hike-sheet">
  <form class="sheet" method="dialog" id="hike-form">
    <header class="sheet-head"><h2 id="hike-title"></h2></header>
    <div class="sheet-body">
    <label><span>Trails</span><input type="text" id="f-trails" placeholder="Purple, Green" required></label>
    <div class="pair">
      <label><span>Meeting latitude</span><input type="number" id="f-lat" step="any" min="-90" max="90" required></label>
      <label><span>Meeting longitude</span><input type="number" id="f-lon" step="any" min="-180" max="180" required></label>
    </div>
    <label><span>Trail map</span><img class="map" id="f-map" alt="" hidden><input type="file" id="f-file" accept="image/png"></label>
    <p class="note" id="hike-note"></p>
    </div>
    <div class="actions">
      <button class="primary" id="save-hike" value="save">Save hike</button>
      <button class="ghost" value="cancel" formnovalidate>Cancel</button>
      <span class="spacer"></span>
      <button class="ghost danger" id="remove-map" value="remove-map" formnovalidate hidden>Remove map</button>
      <button class="ghost danger" id="unschedule" value="unschedule" formnovalidate hidden>Unschedule</button>
    </div>
  </form>
</dialog>

<dialog id="loc-sheet">
  <form class="sheet" method="dialog" id="loc-form">
    <header class="sheet-head"><h2>Locations</h2></header>
    <div class="sheet-body">
    <div id="loc-rows"></div>
    <button class="ghost" type="button" id="add-loc">Add a location</button>
    <p class="note" id="loc-note">A location has to be listed here before you can schedule a hike there.</p>
    </div>
    <div class="actions">
      <button class="primary" value="save">Save locations</button>
      <button class="ghost" value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>

<script>
// Trail blazes are painted on trees in the trail's own colour, and the club's
// trails are named for those colours, so a row wears the blaze of its first
// trail. Anything that isn't a colour gets the preserve green.
//
// The colours themselves are --blaze-* custom properties, so each scheme can
// carry its own set. This is the allowlist, and a trail name is only ever
// interpolated into a var() after passing it — the name comes from stored
// record text, which has no business naming an arbitrary property.
const BLAZE = new Set([
  "purple", "green", "blue", "red", "yellow", "orange", "brown",
  "white", "black", "pink", "silver", "gray", "grey", "tan",
]);

const $ = (id) => document.getElementById(id);
const statusNote = $("status");
let hikes = [];
let orphans = [];
// Row elements by slug, so the save flash doesn't ride on the fetched data.
const rowElements = new Map();
let locations = [];
let editing = null;

// @spec STORE-015
async function api(path, options) {
  const response = await fetch(path, options);
  if (response.status === 204) return null;
  const body = await response.json().catch(() => ({ error: response.statusText }));
  if (!response.ok) throw new Error(body.error || "Request failed");
  return body;
}

function say(element, message, bad) {
  element.textContent = message;
  element.classList.toggle("bad", Boolean(bad));
}

// @spec HIKE-LIST-003
function renderList() {
  const list = $("list");
  list.replaceChildren();
  rowElements.clear();

  for (const hike of hikes) {
    const item = document.createElement("li");
    const row = document.createElement("button");
    row.className = "row";
    row.type = "button";

    const blaze = document.createElement("div");
    blaze.className = "blaze";
    const trail = (hike.trail || "").toLowerCase();
    blaze.style.background = BLAZE.has(trail) ? `var(--blaze-${trail})` : "var(--primary)";

    const text = document.createElement("div");
    const place = document.createElement("div");
    place.className = "place";
    place.textContent = hike.fullName;
    const detail = document.createElement("div");
    detail.className = "detail";
    if (!hike.scheduled) {
      detail.classList.add("unset");
      detail.textContent = "Not scheduled";
    } else {
      detail.textContent = "Scheduled";
    }
    text.append(place, detail);

    const chevron = document.createElement("div");
    chevron.className = "chevron";
    chevron.textContent = "›";
    chevron.setAttribute("aria-hidden", "true");

    row.append(blaze, text, chevron);
    row.addEventListener("click", () => openHike(hike));
    item.append(row);
    list.append(item);
    rowElements.set(hike.shortName, row);
  }
}

// @spec LOC-014
function renderOrphans() {
  const list = $("orphan-list");
  list.replaceChildren();
  $("orphans").hidden = orphans.length === 0;

  for (const orphan of orphans) {
    const item = document.createElement("li");
    item.className = "orphan";
    const slug = document.createElement("span");
    slug.className = "slug";
    slug.textContent = orphan.slug;
    const what = document.createElement("span");
    what.className = "detail";
    what.textContent = orphan.hasRecord && orphan.hasMap
      ? "hike and map"
      : orphan.hasRecord ? "hike, no map" : "map, no hike";
    item.append(slug, what);
    list.append(item);
  }
}

async function load() {
  try {
    [hikes, orphans] = await Promise.all([api("/api/hikes"), api("/api/orphans")]);
    renderList();
    renderOrphans();
    say(statusNote, "");
  } catch (error) {
    say(statusNote, `Could not load hikes. ${error.message}`, true);
  }
}

// @spec MAP-011
async function openHike(hike) {
  editing = hike;
  $("hike-title").textContent = hike.fullName;
  $("unschedule").hidden = !hike.scheduled;
  $("remove-map").hidden = !hike.hasMap;
  say($("hike-note"), "");
  $("f-file").value = "";

  const map = $("f-map");
  map.hidden = !hike.hasMap;
  if (hike.hasMap) map.src = `/api/map/${hike.shortName}?t=${Date.now()}`;

  $("f-trails").value = "";
  $("f-lat").value = "";
  $("f-lon").value = "";
  $("hike-sheet").showModal();

  if (hike.scheduled) {
    try {
      const record = await api(`/api/hikes/${hike.shortName}`);
      $("f-trails").value = record.trails.join(", ");
      $("f-lat").value = record.meeting.lat;
      $("f-lon").value = record.meeting.lon;
    } catch (error) {
      say($("hike-note"), error.message, true);
    }
  }
}

// @spec HIKE-UI-006, MAP-010
async function saveHike() {
  const note = $("hike-note");
  const button = $("save-hike");
  button.disabled = true;
  say(note, "Saving…");

  const body = {
    meeting: { lat: Number($("f-lat").value), lon: Number($("f-lon").value) },
    trails: $("f-trails").value.split(",").map((t) => t.trim()).filter(Boolean),
  };

  try {
    await api(`/api/hikes/${editing.shortName}`, {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });

    const file = $("f-file").files[0];
    if (file) {
      await api(`/api/map/${editing.shortName}`, {
        method: "PUT",
        headers: { "content-type": "image/png" },
        body: file,
      });
    }

    const saved = editing.shortName;
    $("hike-sheet").close();
    await load();
    rowElements.get(saved)?.classList.add("saved");
  } catch (error) {
    say(note, error.message, true);
  } finally {
    button.disabled = false;
  }
}

// Deleting a map is not undoable the way unscheduling is — the bytes are gone
// and the file has to be found again — so this one asks first.
// @spec MAP-015
async function removeMap() {
  if (!confirm(`Remove the trail map for ${editing.fullName}? The hike itself stays.`)) {
    return;
  }
  try {
    await api(`/api/map/${editing.shortName}`, { method: "DELETE" });
    $("hike-sheet").close();
    await load();
  } catch (error) {
    say($("hike-note"), error.message, true);
  }
}

async function unschedule() {
  try {
    await api(`/api/hikes/${editing.shortName}`, { method: "DELETE" });
    await load();
  } catch (error) {
    say(statusNote, error.message, true);
  }
}

// @spec LOC-015
function locationRow(location, existing) {
  const row = document.createElement("div");
  row.className = "loc-row";

  const short = document.createElement("input");
  short.type = "text";
  short.value = location.short_name;
  short.placeholder = "danada-equestrian-center";
  short.setAttribute("aria-label", "Short name used in links");
  // The short name is also the R2 key, so renaming in place would strand the
  // location's hike and map. Renaming is remove-and-re-add, deliberately.
  short.readOnly = Boolean(existing);
  if (existing) {
    short.title = "The short name is also the storage key. To rename, remove this location and add it again.";
  }

  const full = document.createElement("input");
  full.type = "text";
  full.value = location.full_name;
  full.placeholder = "Danada";
  full.setAttribute("aria-label", "Name shown in the app");

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "ghost danger";
  remove.textContent = "Remove";
  remove.addEventListener("click", () => row.remove());

  row.append(short, full, remove);
  return row;
}

async function openLocations() {
  const rows = $("loc-rows");
  rows.replaceChildren();
  try {
    locations = await api("/api/locations");
    for (const location of locations) rows.append(locationRow(location, true));
    $("loc-sheet").showModal();
  } catch (error) {
    say(statusNote, error.message, true);
  }
}

// @spec LOC-012
async function saveLocations() {
  const note = $("loc-note");
  const body = [...$("loc-rows").children].map((row) => ({
    short_name: row.children[0].value.trim(),
    full_name: row.children[1].value.trim(),
  }));
  try {
    await api("/api/locations", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    $("loc-sheet").close();
    await load();
  } catch (error) {
    say(note, error.message, true);
  }
}

$("hike-form").addEventListener("submit", (event) => {
  if (event.submitter?.value === "save") {
    event.preventDefault();
    saveHike();
  } else if (event.submitter?.value === "remove-map") {
    event.preventDefault();
    removeMap();
  } else if (event.submitter?.value === "unschedule") {
    unschedule();
  }
});
$("loc-form").addEventListener("submit", (event) => {
  if (event.submitter?.value === "save") {
    event.preventDefault();
    saveLocations();
  }
});
$("edit-locations").addEventListener("click", openLocations);
$("add-loc").addEventListener("click", () => {
  $("loc-rows").append(locationRow({ short_name: "", full_name: "" }, false));
});

load();
</script>
</body>
</html>
